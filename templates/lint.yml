spec:
  inputs:
    scope:
      description: 'Root of the repo to analyze'
      default: '.'
    stage:
      description: 'CI stage in which to run the job'
      default: 'test'
    fail_on_error:
      description: >-
        Fail the job if blocking findings (error, or unverifiable
        depending on the policy) are detected. Set to false for a
        progressive rollout (report only, without breaking the pipeline).
      type: boolean
      default: true
---

argocd-source-lint:
  stage: $[[ inputs.stage ]]
  image: python:3.11-slim
  before_script:
    # python:3.11-slim doesn't ship git. Every rule here resolves a
    # source through it, and without it the tool degrades into false
    # positives instead of erroring (see DESIGN.md).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    # Pinned to this tag's own release (kept in sync with pyproject.toml by
    # tests/test_release_versions.py).
    - pip install --disable-pip-version-check "argocd-source-lint==1.3.1"
  script:
    - |
      argocd-source-lint "$[[ inputs.scope ]]" --format gitlab-codequality --output gl-code-quality-report.json
      exit_code=$?
      argocd-source-lint "$[[ inputs.scope ]]" --format table
      if [ "$[[ inputs.fail_on_error ]]" = "true" ]; then
        exit "$exit_code"
      fi
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    when: always
