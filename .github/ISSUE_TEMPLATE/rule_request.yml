name: New rule or operator signature
description: Suggest a new rule, or a new known_operators entry for missing-ignore-diff
labels: ["enhancement"]
body:
  - type: textarea
    id: failure
    attributes:
      label: What mistake does this catch
      description: >
        Describe the ArgoCD behavior this would detect, and what happens today without a warning
        (a field gets reset, a sync option is ignored, and so on).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source
      description: >
        A link to the ArgoCD docs, the ArgoCD source, or the operator's own documentation
        that states the behavior. See CONTRIBUTING.md: a signature is only added when the
        documentation states the behavior directly, not inferred from an example.
    validations:
      required: true
