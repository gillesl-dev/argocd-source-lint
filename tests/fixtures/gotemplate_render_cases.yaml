  - {template: '{{ toJson .small }}'}
  - {template: '{{ toJson .html }}'}
  - {template: '{{ toJson .uni }}'}
  - {template: '{{ toJson .keyuni }}'}
  - {template: '{{ toJson .missing }}'}
  - {template: '{{ toJson .z }}'}
