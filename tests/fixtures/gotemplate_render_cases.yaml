  - {template: '{{ toYaml .e }}'}
  - {template: '{{ toYaml .yes }}'}
  - {template: '{{ toYaml .on }}'}
  - {template: '{{ toYaml .tilde }}'}
  - {template: '{{ toYaml .hex }}'}
  - {template: '{{ toYaml .num }}'}
  - {template: '{{ toYaml .multi }}'}
  - {template: '{{ toYaml .z }}'}
  - {template: '{{ toYaml .missing }}'}
  - {template: '{{ toYaml .el }}'}
  - {template: '{{ toYaml .em }}'}
  - {template: '{{ toYaml .t }}'}
  - {template: '{{ toYaml .uni }}'}
  - {template: '{{ toYaml .keyuni }}'}
  - {template: '{{ toYaml . }}'}
  - {template: '{{ toJson .m }}'}
  - {template: '{{ toJson .nl }}'}
