# ---- The goTemplate example of examples/gotemplate ----

- name: gt-example-platform
  files:
    apps/dev/guestbook/deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: guestbook
      spec:
        replicas: 1
        selector:
          matchLabels: {app: guestbook}
        template:
          metadata:
            labels: {app: guestbook}
          spec:
            containers:
              - name: guestbook
                image: guestbook:1.0.0
    apps/dev/redis/deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
      spec:
        replicas: 1
        selector:
          matchLabels: {app: redis}
        template:
          metadata:
            labels: {app: redis}
          spec:
            containers:
              - name: redis
                image: redis:1.0.0
    apps/prod/guestbook/deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: guestbook
      spec:
        replicas: 1
        selector:
          matchLabels: {app: guestbook}
        template:
          metadata:
            labels: {app: guestbook}
          spec:
            containers:
              - name: guestbook
                image: guestbook:1.0.0
    envs/dev/config.yaml: |
      cluster:
        name: dev
        server: https://kubernetes.default.svc
    envs/prod/config.yaml: |
      cluster:
        name: prod
        server: https://prod.example.com
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
      name: platform
      namespace: argocd
    spec:
      goTemplate: true
      goTemplateOptions: ["missingkey=error"]
      generators:
        - matrix:
            generators:
              # One entry per environment, from its config file.
              - git:
                  repoURL: https://example.invalid/repo.git
                  revision: HEAD
                  files:
                    - path: envs/*/config.yaml
              # Every application, in each environment.
              - list:
                  elements:
                    - app: guestbook
                      port: 80
                    - app: redis
                      port: 6379
      template:
        metadata:
          name: '{{ .app }}-{{ .path.basename | normalize }}'
          labels:
            env: '{{ .path.basename }}'
            tier: '{{ if eq .app "redis" }}data{{ else }}web{{ end }}'
        spec:
          project: default
          source:
            repoURL: https://example.invalid/repo.git
            targetRevision: HEAD
            path: 'apps/{{ .path.basename }}/{{ .app }}'
          destination:
            server: '{{ .cluster.server }}'
            namespace: '{{ printf "%s-%s" .app .cluster.name }}'

