  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            files:
              - path: clusters/*.json
      template:
        metadata: {name: 'app-{{cluster.name}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'm/{{cluster.tags.0}}/{{cluster.tags.1}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{cluster.name}}'}

- name: git-files-list-of-objects-and-empty-file
  files:
    envs/all.yaml: "- env: dev\n- env: prod\n"
    envs/none/config.yaml: ""
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            files:
              - path: envs/all.yaml
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            files:
              - path: envs/*/config.yaml
      template:
        metadata: {name: 'app-{{path.basenameNormalized}}-{{path.filename}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

