    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - matrix:
            generators:
              - list:
                  elements: [{env: dev}]
              - list:
                  elements: [{env: prod}]
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

- name: matrix-two-gits-without-prefix
  files:
    apps/web/cm.yaml: "kind: ConfigMap\n"
    envs/web/config.json: '{"env": "prod"}'
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - matrix:
            generators:
              - git:
                  repoURL: https://example.invalid/repo.git
                  revision: HEAD
                  directories: [{path: apps/*}]
              - git:
                  repoURL: https://example.invalid/repo.git
                  revision: HEAD
                  files: [{path: 'envs/{{path.basename}}/config.json'}]
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'm/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

- name: matrix-two-gits-with-prefix
  files:
    apps/web/cm.yaml: "kind: ConfigMap\n"
    apps/api/cm.yaml: "kind: ConfigMap\n"
    envs/web/config.json: '{"env": "prod"}'
    envs/api/config.json: '{"env": "dev"}'
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - matrix:
            generators:
              - git:
                  repoURL: https://example.invalid/repo.git
                  revision: HEAD
                  directories: [{path: apps/*}]
              - git:
                  repoURL: https://example.invalid/repo.git
                  revision: HEAD
                  pathParamPrefix: target
                  files: [{path: 'envs/{{path.basename}}/config.json'}]
      template:
        metadata: {name: '{{path.basename}}-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{target.path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{env}}'}

- name: merge-override
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - merge:
            mergeKeys: [server]
            generators:
              - list:
                  elements:
                    - {server: dev, path: base-dev}
                    - {server: prod, path: base-prod}
              - list:
                  elements:
                    - {server: dev, path: override-dev}
                    - {server: other, path: ignored}
      template:
        metadata: {name: 'app-{{server}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{server}}'}

