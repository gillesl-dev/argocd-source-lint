  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      goTemplate: true
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            directories: [{path: 'apps/*'}, {path: 'apps/*/*'}]
            values:
              name: '{{ .path.basename }}'
              second: '{{ index .path.segments 1 }}'
              plain: fixed
      template:
        metadata: {name: '{{ .values.name }}'}
        spec:
