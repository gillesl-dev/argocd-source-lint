# ---- goTemplate: true. The oracle also records each generator's param sets. ----

- name: gt-list-raw-values
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      goTemplate: true
      generators:
        - list:
            elements:
              - env: dev
                replicas: 3
                ratio: 0.5
                enabled: true
                tags: [a, b]
                cfg: {region: eu, nested: {deep: 1}}
                values: {dir: d1}
                nothing: null
              - env: prod
            elementsYaml: |
              - env: yaml
                port: 8080
                big: 1e21
                on: 'on'
      template:
        metadata: {name: 'app-{{ .env }}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{ .env }}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

