- name: merge-override
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - merge:
            mergeKeys: [server]
            generators:
              - list:
                  elements:
                    - {server: dev, path: base-dev}
                    - {server: prod, path: base-prod}
              - list:
                  elements:
                    - {server: dev, path: override-dev}
                    - {server: other, path: ignored}
      template:
        metadata: {name: 'app-{{server}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{server}}'}

