- name: gt-matrix-deep-merge
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      goTemplate: true
      generators:
        - matrix:
            generators:
              - list:
                  elements:
                    - name: a
                      cfg: {x: 1, sub: {p: 1}, emptyMap: {}, replaced: {k: v}}
                      l: []
                      s: ""
                      nn: null
                      z: 0
                      f: false
                      only: first
              - list:
                  elements:
                    - name: b
                      cfg: {yy: 2, sub: {q: 2}, emptyMap: {kept: x}, replaced: scalar}
                      l: [1, 2]
                      s: bval
                      nn: 1
                      z: 5
                      f: true
                      second: only
      template:
        metadata: {name: 'app-{{ .name }}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{ .name }}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

- name: gt-matrix-second-child-rendered
  files:
    components.yaml: "components:\n  - {name: guestbook, chart: guestbook, version: 1.2.3}\n  - {name: redis, chart: redis, version: 17}\n"
  appset: |
