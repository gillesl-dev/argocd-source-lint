- name: generator-level-template
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - list:
            elements: [{env: dev}]
            template:
              metadata: {}
              spec:
                project: default
                source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'override/{{env}}'}
                destination: {}
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}
