# ApplicationSets whose expansion is compared with Argo CD's own code.
# Each case is a repository: `files`, plus `appset` at bootstrap/appset.yaml.
# Expected results: appset_oracle_expected.json, written by
# tools/argocd-oracle/regenerate.py (see CONTRIBUTING.md).
#
# Every ApplicationSet sets its namespace and the template its project, which
# Argo CD otherwise leaves empty where this tool assumes `argocd`/`default`.

- name: list-basic
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - list:
            elements:
              - env: dev
                url: https://dev.invalid
              - env: prod
                url: https://prod.invalid
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{env}}'}
          destination: {server: '{{url}}', namespace: '{{env}}'}

- name: list-values-map
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - list:
            elements:
              - env: dev
                values: {dir: d1, ns: team-a}
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{values.dir}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{values.ns}}'}

- name: list-non-string-value
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - list:
            elements:
              - env: dev
                replicas: 3
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: dev}

- name: elements-yaml-top-level-strings
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - list:
            elementsYaml: |
              - env: dev
                replicas: 3
              - env: prod
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{env}}'}

- name: git-directories-normalized-dots
  files:
    apps/my.app/cm.yaml: "kind: ConfigMap\n"
    apps/Other_App/cm.yaml: "kind: ConfigMap\n"
    apps/.hidden/cm.yaml: "kind: ConfigMap\n"
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            directories:
              - path: apps/*
      template:
        metadata: {name: '{{path.basenameNormalized}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{path[1]}}'}

- name: git-directories-exclude
  files:
    apps/a/cm.yaml: "kind: ConfigMap\n"
    apps/b/cm.yaml: "kind: ConfigMap\n"
    apps/c/cm.yaml: "kind: ConfigMap\n"
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            directories:
              - path: apps/*
              - path: apps/b
                exclude: true
      template:
        metadata: {name: 'app-{{path.basename}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

- name: git-files-value-formatting
  files:
    envs/dev/config.yaml: "env: dev\nenabled: yes\nreplicas: 1000000\nratio: 1.0\nempty:\nmode: 0755\n"
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            files:
              - path: envs/*/config.yaml
      template:
        metadata: {name: 'app-{{env}}-{{path.filenameNormalized}}'}
        spec:
          project: default
          source:
            repoURL: https://example.invalid/repo.git
            targetRevision: HEAD
            path: 'm/{{enabled}}/{{replicas}}/{{ratio}}/{{empty}}/{{mode}}'
          destination: {server: https://kubernetes.default.svc, namespace: '{{path.basename}}'}

- name: git-files-nested-and-lists
