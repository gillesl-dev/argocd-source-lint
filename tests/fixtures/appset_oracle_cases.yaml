    envs/dev.yaml: "env: dev\n"
    envs/broken.yaml: "just-a-string\n"
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            files:
              - path: envs/*.yaml
      template:
        metadata: {name: 'app-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'm/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: default}

- name: git-path-param-prefix-and-values
  files:
    apps/web/cm.yaml: "kind: ConfigMap\n"
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - git:
            repoURL: https://example.invalid/repo.git
            revision: HEAD
            pathParamPrefix: app
            values:
              ns: 'team-{{app.path.basename}}'
              other: '{{ missing }}'
            directories:
              - path: apps/*
      template:
        metadata: {name: '{{app.path.basename}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: '{{app.path}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{values.ns}}'}

- name: matrix-list-by-list
  appset: |
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata: {name: s, namespace: argocd}
    spec:
      generators:
        - matrix:
            generators:
              - list:
                  elements: [{env: dev}, {env: prod}]
              - list:
                  elements: [{app: web}, {app: api}]
      template:
        metadata: {name: '{{app}}-{{env}}'}
        spec:
          project: default
          source: {repoURL: https://example.invalid/repo.git, targetRevision: HEAD, path: 'apps/{{app}}/{{env}}'}
          destination: {server: https://kubernetes.default.svc, namespace: '{{env}}'}

