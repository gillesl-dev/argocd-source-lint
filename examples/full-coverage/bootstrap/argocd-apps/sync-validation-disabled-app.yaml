apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-validation-disabled
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
    targetRevision: HEAD
    path: manifests/sync-validation-demo
  syncPolicy:
    syncOptions:
      - Validate=false
