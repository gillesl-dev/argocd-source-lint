apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: missing-prune-protection
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
    targetRevision: HEAD
    path: manifests/prune-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: prune-demo
  syncPolicy:
    automated:
      prune: true
