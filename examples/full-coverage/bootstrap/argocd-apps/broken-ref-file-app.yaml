apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: broken-ref-file
  namespace: argocd
spec:
  sources:
    - repoURL: https://charts.example.invalid/repo
      chart: something
      targetRevision: "1.0.0"
      helm:
        valueFiles:
          - $values/applications/broken-ref-file/does-not-exist.yaml
    - repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
      targetRevision: HEAD
      ref: values
