apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unknown-sync-option-demo
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
    targetRevision: HEAD
    path: manifests/unknown-sync-option-demo
  syncPolicy:
    syncOptions:
      - PruneLatest=true
