apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-missing-ignorediff
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
    targetRevision: HEAD
    path: infrastructure/pg-missing
  syncPolicy:
    automated:
      selfHeal: true
