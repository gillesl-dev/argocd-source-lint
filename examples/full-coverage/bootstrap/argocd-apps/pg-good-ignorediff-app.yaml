apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-good-ignorediff
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
    targetRevision: HEAD
    path: infrastructure/pg-good
  syncPolicy:
    automated:
      selfHeal: true
  ignoreDifferences:
    - kind: Secret
      name: pg-good-app
    - kind: Secret
      name: pg-good-ca
