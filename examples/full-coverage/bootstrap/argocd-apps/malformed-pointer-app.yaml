apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: malformed-pointer-demo
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gillesl-dev/argocd-source-lint.git
    targetRevision: HEAD
    path: manifests/malformed-pointer-demo
  ignoreDifferences:
    - kind: ConfigMap
      jsonPointers:
        - metadata/annotations/foo
