# Operator signatures for the missing-ignore-diff rule. The rule is generic,
# so supporting a new operator only needs an entry here.
#
# - crd_trigger: "<group>/<Kind>" of the custom resource that triggers the check.
# - name_from: dotted path to the name in that resource, such as metadata.name.
# - name_from_each: optional dotted path to a mapping in the same resource.
#     expect_ignore_on is then evaluated once per key, with {user} bound to it.
# - expect_ignore_on: derived resources, each with a name_pattern using
#     {name} and, with name_from_each, {user}. A selfHeal Application that
#     deploys crd_trigger without a matching ignoreDifferences is flagged.

- crd_trigger: postgresql.cnpg.io/Cluster
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-app"
    - kind: Secret
      name_pattern: "{name}-ca"

- crd_trigger: cert-manager.io/Certificate
  name_from: spec.secretName
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}"

- crd_trigger: elasticsearch.k8s.elastic.co/Elasticsearch
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-es-elastic-user"

- crd_trigger: rabbitmq.com/RabbitmqCluster
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-default-user"

# Strimzi only creates the Secret for spec.authentication.type "scram-sha-512"
# or "tls", so this can false-positive on other KafkaUsers. Signatures cannot
# express conditions, which is why the rule defaults to warning.
- crd_trigger: kafka.strimzi.io/KafkaUser
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}"

# One Secret per spec.users entry, per the Zalando operator docs:
# "{username}.{clustername}.credentials.postgresql.acid.zalan.do".
# The cross-namespace "{namespace}.{username}..." form is not covered.
- crd_trigger: acid.zalan.do/postgresql
  name_from: metadata.name
  name_from_each: spec.users
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{user}.{name}.credentials.postgresql.acid.zalan.do"

# Name used by the default spec.bootstrapAdmin, per the Keycloak Operator
# docs. A custom bootstrapAdmin secret is not covered.
- crd_trigger: k8s.keycloak.org/Keycloak
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-initial-admin"

# spec.target.name defaults to metadata.name (External Secrets API reference).
# An explicit target name is not covered. The selfHeal conflict is
# documented in Akuity's support knowledge base.
- crd_trigger: external-secrets.io/ExternalSecret
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}"
