# Community signature pack for the missing-ignore-diff rule. Adding an
# operator here is a plain YAML PR, never a code change: the rule engine
# (rules/missing_ignore_diff.py) is entirely generic.
#
# - crd_trigger : "<group>/<Kind>" of the CRD that triggers the check.
# - name_from   : dotted path to the name to extract from the found CRD
#                 instance (e.g. metadata.name).
# - name_from_each : optional dotted path to a mapping on the same CRD
#                 instance (e.g. a Zalando postgresql resource's
#                 spec.users): when set, expect_ignore_on is evaluated
#                 once per key of that mapping, with {user} bound to the
#                 key on top of {name}. Omit it for the common case of a
#                 single derived name per instance.
# - expect_ignore_on : expected derived resources, with a `name_pattern`
#                 templated by `{name}` (the name resolved via
#                 `name_from`) and, when `name_from_each` is set, `{user}`
#                 too. An Application with `selfHeal: true` that has an
#                 instance of `crd_trigger` but no `ignoreDifferences`
#                 matching one of these resources is flagged.

- crd_trigger: postgresql.cnpg.io/Cluster
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-app"
    - kind: Secret
      name_pattern: "{name}-ca"

- crd_trigger: cert-manager.io/Certificate
  name_from: spec.secretName
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}"

- crd_trigger: elasticsearch.k8s.elastic.co/Elasticsearch
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-es-elastic-user"

- crd_trigger: rabbitmq.com/RabbitmqCluster
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-default-user"

# Only generates a Secret for spec.authentication.type "scram-sha-512"
# or "tls": an ACL-only or "tls-external" KafkaUser never gets one, so
# this can false-positive on those. missing-ignore-diff is warning-only
# and heuristic by nature (see rules/missing_ignore_diff.py) precisely
# because a signature can't express that kind of conditional trigger.
- crd_trigger: kafka.strimzi.io/KafkaUser
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}"

# One Secret per entry in spec.users (confirmed against the operator's
# own docs, not assumed): "{username}.{clustername}.credentials.postgresql.acid.zalan.do".
# The cross-namespace username variant ("{namespace}.{username}...") is
# a rarer edge case, not covered here.
- crd_trigger: acid.zalan.do/postgresql
  name_from: metadata.name
  name_from_each: spec.users
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{user}.{name}.credentials.postgresql.acid.zalan.do"

# Only the default spec.bootstrapAdmin behavior (no explicit secret
# override) produces this derived name, confirmed against the
# official Keycloak Operator docs. Same conditional-trigger limitation
# as the KafkaUser entry above: a custom bootstrapAdmin secret isn't
# covered.
- crd_trigger: k8s.keycloak.org/Keycloak
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}-initial-admin"

# spec.target.name defaults to the ExternalSecret's own metadata.name
# when omitted (confirmed against the official API reference); an
# explicit override isn't covered, a false negative rather than a
# guess. Documented as a real ArgoCD/ESO footgun by Akuity's own
# support KB, not assumed.
- crd_trigger: external-secrets.io/ExternalSecret
  name_from: metadata.name
  expect_ignore_on:
    - kind: Secret
      name_pattern: "{name}"
